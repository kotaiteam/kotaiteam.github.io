overview: >-
  Rocket is an adaptive coaching application designed for athletes training across triathlon, HYROX,
  running, strength, mobility, breathwork, swimming, and cycling. The platform creates personalized
  training plans around the athlete's goals, races, schedule, and lifestyle, while syncing workouts
  with connected fitness devices such as Garmin, Apple, and Strava.

business_problems:
  - Athletes often follow rigid training plans that do not adapt to real-life schedule changes.
  - Multi-discipline athletes need one system for endurance, strength, recovery, and race preparation.
  - Manual workout planning becomes time-consuming and difficult to sustain.
  - Training decisions can feel confusing without structured coaching guidance.
  - Athletes need watch-synced workouts to reduce friction during daily training.
  - Generic plans often fail to account for race goals, discipline mix, and personal availability.

objectives_intro: >-
  Creating one adaptive coaching engine that helps athletes train with purpose, structure, and
  flexibility across multiple race disciplines.

objectives:
  - Generate personalized training plans within minutes.
  - Improve athlete consistency through structured daily sessions.
  - Support multiple disciplines in one connected app.
  - Adapt training around race goals, lifestyle, schedule, and recovery needs.
  - Sync workouts with wearable and fitness platforms.
  - Reduce dependency on manual planning and scattered training tools.

ai_functionality:
  - Adaptive plan generation based on athlete profile, goals, race calendar, and schedule.
  - Smart training adjustments around lifestyle changes and availability.
  - Multi-discipline planning across endurance, strength, mobility, and recovery.
  - Automated session structuring so every workout is ready before training.
  - Connected device syncing for Garmin, Apple, and Strava-based workout execution.

impact_of_challenges:
  - Converts rigid coaching programs into flexible, athlete-specific training systems.
  - Helps athletes balance endurance, strength, recovery, and race preparation.
  - Reduces decision fatigue by making daily workout choices clear.
  - Improves accountability through synced sessions and structured plans.
  - Supports athletes who train for more than one event type.
  - Creates a science-backed coaching experience without relying only on manual coaching.

solution_items:
  - Developed an adaptive coaching platform for triathlon, HYROX, running, strength, mobility, breathwork, swimming, and cycling.
  - Created an onboarding flow to capture races, goals, schedule, and athlete preferences.
  - Built personalized multi-discipline training plans around user availability.
  - Integrated workout syncing with Garmin, Apple, and Strava.
  - Added structured daily sessions for purpose-driven training.
  - Designed a mobile-first experience for iOS and Android beta users.

