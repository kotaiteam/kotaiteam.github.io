overview: >-
  Tribe2Home is a technology platform created to help people find the right housemate to share their
  home. The platform connects NDIS participants, support coordinators, and providers in one place to
  enable meaningful connections, improve housemate compatibility, and reduce vacancy time.

business_problems:
  - NDIS participants may struggle to find compatible housemates for shared living.
  - Support coordinators and providers often rely on manual referrals and disconnected communication.
  - Housing vacancies can remain open for longer due to poor visibility and limited matching tools.
  - Compatibility between housemates is difficult to assess without a structured platform.
  - Participants need safer, more meaningful connections before committing to shared living.

objectives_intro: >-
  Creating a trusted shared-living connection platform that helps NDIS participants, support
  coordinators, and providers find compatible housemates faster and more confidently.

objectives:
  - Improve housemate discovery for NDIS participants.
  - Reduce vacancy time for shared living homes.
  - Centralize participant, coordinator, and provider connections.
  - Improve compatibility-based matching.
  - Reduce manual coordination effort.
  - Support more meaningful and suitable shared-home arrangements.

ai_functionality:
  - Smart compatibility matching based on participant needs and shared-living preferences.
  - Automated filtering to identify suitable housemate opportunities.
  - Matching logic to support better participant-provider-coordinator connections.
  - Intelligent vacancy visibility to reduce time spent searching manually.
  - Recommendation-based discovery for more meaningful housemate matches.

impact_of_challenges:
  - Reduces the stress of finding suitable shared-living arrangements.
  - Helps providers fill vacancies with more compatible participants.
  - Supports coordinators with a centralized platform for housing connections.
  - Improves participant confidence before entering a shared home.
  - Converts manual referral-based matching into a structured digital process.

solution_items:
  - Developed a technology platform for NDIS housemate and shared-home matching.
  - Connected NDIS participants, support coordinators, and providers in one ecosystem.
  - Enabled better visibility of shared-living opportunities.
  - Supported compatibility-based housemate discovery.
  - Reduced vacancy time through faster connection and matching workflows.
  - Created a simple enquiry-led onboarding flow for interested users.

